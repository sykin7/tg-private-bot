name: Build Boss Bot (Enterprise)

on:
  push:
    branches: [ "main" ]
    # 关键点 1: 只有当 Boss 文件夹内的文件发生变化时，才触发这个构建
    # 这样就不会干扰你的 my_bot
    paths:
      - 'Boss/**'
      - '.github/workflows/docker-boss.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 关键点 2: 给这个镜像起一个完全不同的名字，比如 boss-bot
  IMAGE_NAME: ${{ github.repository_owner }}/boss-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 关键点 3: 指定构建上下文为 Boss 文件夹
          context: ./Boss
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Enterprise Defense Bot
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
